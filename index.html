<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PulsePal — Vehicle Intelligence</title>

  <meta name="description" content="Monitor your vehicle in real time with PulsePal">
  <meta name="theme-color" content="#FF7A1A">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icon/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icon/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PulsePal">

  <!-- Apply saved theme BEFORE first paint, to avoid a light-mode
       flash on load when the user has dark mode on. Kept tiny and
       inline (not in app.js) since it must run before CSS paints. -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('pulsepal_theme')
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch (e) {}
    })()
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">

  <!-- Leaflet (map.html uses this) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

  <div id="app">

    <!-- TOP BAR: shown only on Layout 2 (main app) pages. router.js toggles .hidden -->
    <header id="top-bar" class="top-bar hidden">
      <h1 id="top-bar-title" class="top-bar-title">Home</h1>
      <button id="top-bar-bell" class="top-bar-bell" aria-label="Notifications">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C10.34 2 9 3.34 9 5V5.29C6.51 6.14 4.75 8.5 4.75 11.25V15.5L3 18V19H21V18L19.25 15.5V11.25C19.25 8.5 17.49 6.14 15 5.29V5C15 3.34 13.66 2 12 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M9.5 21C9.5 22.1 10.62 23 12 23C13.38 23 14.5 22.1 14.5 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span id="top-bar-bell-dot" class="notif-dot hidden"></span>
      </button>

      <div id="notification-panel" class="hidden">
        <div id="notification-panel-header">
          <span>Notifications</span>
          <button id="notification-panel-close" aria-label="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="notification-panel-list"></div>
      </div>
    </header>

    <!-- CONTENT: router.js injects the active page's markup here -->
    <main id="content" class="content"></main>

    <!-- BOTTOM NAV: shown only on Layout 2 (main app) pages -->
    <nav id="bottom-nav" class="bottom-nav hidden">
      <button class="nav-item" data-page="home" aria-label="Home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 11.5L12 4L21 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5.5 10V19C5.5 19.5523 5.94772 20 6.5 20H17.5C18.0523 20 18.5 19.5523 18.5 19V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.5 20V14.5C9.5 13.9477 9.94772 13.5 10.5 13.5H13.5C14.0523 13.5 14.5 13.9477 14.5 14.5V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="nav-label">Home</span>
      </button>

      <button class="nav-item" data-page="faults" aria-label="Faults">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L22 20H2L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M12 10V14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="17" r="1" fill="currentColor"/>
        </svg>
        <span class="nav-label">Faults</span>
        <span id="nav-fault-badge" class="nav-badge hidden">1</span>
      </button>

      <button class="nav-item" data-page="map" aria-label="Map">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 20L3 18V5L9 7M9 20L15 18M9 20V7M15 18L21 20V7L15 5M15 18V5M9 7L15 5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span class="nav-label">Map</span>
      </button>

      <button class="nav-item" data-page="trips" aria-label="Trips">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 19V13C4 9.13401 7.13401 6 11 6H12C15.866 6 19 9.13401 19 13V19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M2 19H22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="8" cy="19" r="1.4" fill="currentColor"/>
          <circle cx="16" cy="19" r="1.4" fill="currentColor"/>
          <path d="M11.5 3V6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="nav-label">Trips</span>
      </button>

      <button class="nav-item" data-page="settings" aria-label="Settings">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <span class="nav-label">Settings</span>
      </button>
    </nav>

    <!-- PULSE AI FLOATING ASSISTANT — lives outside #content so it
         persists across every page navigation, not reloaded per-page -->
    <button id="pulse-ai-fab" aria-label="Pulse AI Assistant">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="7" width="16" height="12" rx="3" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="9" cy="13" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="13" r="1.3" fill="currentColor"/>
        <path d="M12 7V4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="12" cy="3" r="1" fill="currentColor"/>
      </svg>
    </button>

    <div id="pulse-ai-panel" class="hidden">
      <div id="pulse-ai-panel-header">
        <span>Pulse AI</span>
        <div style="display:flex;gap:4px;">
          <button id="pulse-ai-expand-btn" aria-label="Open full chat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 3H21V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 21H3V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 3L14 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 21L10 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button id="pulse-ai-close-btn" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div id="pulse-ai-panel-messages"></div>
      <div id="pulse-ai-panel-input-row">
        <input type="text" id="pulse-ai-panel-input" placeholder="Ask about your vehicle...">
        <button id="pulse-ai-panel-send" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22 2L11 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

  </div>

  <!-- Leaflet JS (used by map.js on map.html) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App scripts, load order matters -->
  <script src="js/dummy-data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/map.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
